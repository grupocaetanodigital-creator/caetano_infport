<!doctype html>
<html lang="pt-BR">
  <head>
    <script>
      // Blindagem global no navegador contra ReferenceError de escopos legados
      window.idCondominioAtivo = window.idCondominioAtivo || '';

      // Diretriz do AI Studio: HMR desativado no ambiente embutido em iframe. Ignora erros inofensivos de WebSocket.
      (function() {
        var _err = console.error;
        var _warn = console.warn;
        console.error = function() {
          var str = Array.prototype.slice.call(arguments).map(function(a) {
            return (a && a.message) ? a.message : String(a);
          }).join(' ');
          if (str.indexOf('[vite]') !== -1 && (str.indexOf('websocket') !== -1 || str.indexOf('WebSocket') !== -1 || str.indexOf('ws://') !== -1 || str.indexOf('wss://') !== -1)) {
            return;
          }
          return _err.apply(console, arguments);
        };
        console.warn = function() {
          var str = Array.prototype.slice.call(arguments).map(function(a) {
            return (a && a.message) ? a.message : String(a);
          }).join(' ');
          if (str.indexOf('[vite]') !== -1 && (str.indexOf('websocket') !== -1 || str.indexOf('WebSocket') !== -1 || str.indexOf('ws://') !== -1 || str.indexOf('wss://') !== -1)) {
            return;
          }
          return _warn.apply(console, arguments);
        };
      })();

      // Desregistra Service Workers legados e limpa caches antigos para carregar o bundle atualizado
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var reg of registrations) {
            reg.unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var name of names) {
            if (name.includes('workbox') || name.includes('precache') || name.includes('infport')) {
              caches.delete(name);
            }
          }
        });
      }
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
